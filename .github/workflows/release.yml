# Builds, tests and packages tiki for x86-64 Linux (scripts/package.sh) and Windows
# (scripts/package_windows.sh), and on a version tag (v<ENGINE_VERSION>, e.g. v0.0.1) publishes the
# packages as a GitHub release. Run it by hand (Actions > Release > Run workflow) to build the
# packages as a workflow artifact without releasing.
#
# The network can be built into the binaries (TIKI_EMBED_NETWORK, the newest in models/), so they run
# without a .nnue file or the run scripts: the 'embed_network' input when run by hand, and for tag
# pushes (which have no inputs) the repository variable TIKI_EMBED_NETWORK set to 'true'.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      embed_network:
        description: "Build the newest network in models/ into the binaries"
        type: boolean
        default: false

permissions:
  contents: write

env:
  EMBED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.embed_network) || (github.event_name == 'push' && vars.TIKI_EMBED_NETWORK == 'true')) && '-DTIKI_EMBED_NETWORK=ON' || '' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the engine version
        if: github.ref_type == 'tag'
        run: |
          version=v$(sed -n 's/^#define ENGINE_VERSION *"\(.*\)".*/\1/p' engine/core/src/version.h | tr -d '\r')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ENGINE_VERSION ($version) in engine/core/src/version.h"
            exit 1
          fi

      # bmi2: AVX2 and PEXT (Intel Haswell+, AMD Zen 3+). avx2: no PEXT, which is slow on AMD Zen 1/2.
      # x86-64: neither, for any x86-64 CPU.
      - name: Build, test and package
        run: |
          sh scripts/package.sh x86-64-bmi2 -DTIKI_USE_AVX2=ON -DTIKI_USE_PEXT=ON $EMBED
          sh scripts/package.sh x86-64-avx2 -DTIKI_USE_AVX2=ON -DTIKI_USE_PEXT=OFF $EMBED
          sh scripts/package.sh x86-64 -DTIKI_USE_AVX2=OFF -DTIKI_USE_PEXT=OFF $EMBED

      - uses: actions/upload-artifact@v4
        with:
          name: tiki-linux
          path: |
            dist/*.tar.gz
            dist/bench-*.txt

  # Clang targeting the MSVC ABI, with the runner's Visual Studio for the Windows SDK and linker.
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM and Ninja
        run: |
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
          command -v ninja || choco install ninja --no-progress -y
          "/c/Program Files/LLVM/bin/clang" --version

      # The same variants as Linux.
      - name: Build, test and package
        run: |
          sh scripts/package_windows.sh x86-64-bmi2 -DTIKI_USE_AVX2=ON -DTIKI_USE_PEXT=ON $EMBED
          sh scripts/package_windows.sh x86-64-avx2 -DTIKI_USE_AVX2=ON -DTIKI_USE_PEXT=OFF $EMBED
          sh scripts/package_windows.sh x86-64 -DTIKI_USE_AVX2=OFF -DTIKI_USE_PEXT=OFF $EMBED

      - uses: actions/upload-artifact@v4
        with:
          name: tiki-windows
          path: |
            dist/*.zip
            dist/bench-*.txt

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Every variant on every platform must search exactly the same tree.
      - name: Check the bench signatures match
        run: |
          grep -H "Nodes searched" dist/bench-*.txt
          [ "$(grep -h "Nodes searched" dist/bench-*.txt | tr -d '\r' | sort -u | wc -l)" -eq 1 ]
          cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: tiki-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nodes=$(grep -h "Nodes searched" dist/bench-x86-64-bmi2.txt | tr -dc '0-9')
          embedded=""
          if [ -n "$EMBED" ]; then
            embedded="It's also built into \`bin/tiki\` and \`bin/tiki.exe\`, so a GUI can run them directly (\`TIKI_EVALFILE\` or the \`EvalFile\` option still override it)."
          fi
          cat > notes.md <<EOF
          Unpack one package and run \`tiki-$GITHUB_REF_NAME/scripts/run.sh\` on Linux or
          \`tiki-$GITHUB_REF_NAME\\scripts\\run.bat\` on Windows (or point a UCI GUI at it).
          The network is in \`models/\`; set \`TIKI_EVALFILE\` to use another.
          $embedded

          | Package | CPUs |
          |---|---|
          | \`linux-x86-64-bmi2\`, \`windows-x86-64-bmi2\` | Intel Haswell (2013) or later, AMD Zen 3 (2020) or later |
          | \`linux-x86-64-avx2\`, \`windows-x86-64-avx2\` | AMD Zen 1/2 (AVX2, but PEXT is slow) |
          | \`linux-x86-64\`, \`windows-x86-64\` | Any x86-64 CPU |

          Bench signature: $nodes nodes.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "tiki $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes
