# Builds, tests and packages tiki for x86-64 Linux (scripts/package.sh) and Windows
# (scripts/package_windows.sh), and on a version tag (v<ENGINE_VERSION>, e.g. v0.0.1) publishes the
# packages as a GitHub release. Run it by hand (Actions > Release > Run workflow) to build the
# packages as a workflow artifact without releasing.
#
# The network is always built into the binaries (TIKI_EMBED_NETWORK, the newest in models/ the engine
# reads), so they run without a .nnue file or the run scripts.
#
# One package per CPU level and platform, Stockfish's levels and names (TIKI_ARCH in engine/CMakeLists.txt),
# as CCRL and other testers expect. A level the runner's CPU doesn't run is built but not tested or benched.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  EMBED: -DTIKI_EMBED_NETWORK=ON
  ARCHES: >-
    x86-64 x86-64-sse41-popcnt x86-64-avx2 x86-64-bmi2 x86-64-avxvnni x86-64-avx512 x86-64-vnni512
    x86-64-avx512icl

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the engine version
        if: github.ref_type == 'tag'
        run: |
          version=v$(sed -n 's/^#define ENGINE_VERSION *"\(.*\)".*/\1/p' engine/core/src/version.h | tr -d '\r')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ENGINE_VERSION ($version) in engine/core/src/version.h"
            exit 1
          fi

      - name: Build, test and package
        run: |
          for arch in $ARCHES; do sh scripts/package.sh $arch $EMBED; done

      - uses: actions/upload-artifact@v4
        with:
          name: tiki-linux
          path: |
            dist/*.tar.gz
            dist/bench-*.txt

  # Clang targeting the MSVC ABI, with the runner's Visual Studio for the Windows SDK and linker.
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM and Ninja
        run: |
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
          command -v ninja || choco install ninja --no-progress -y
          "/c/Program Files/LLVM/bin/clang" --version

      # The same levels as Linux.
      - name: Build, test and package
        run: |
          for arch in $ARCHES; do sh scripts/package_windows.sh $arch $EMBED; done

      - uses: actions/upload-artifact@v4
        with:
          name: tiki-windows
          path: |
            dist/*.zip
            dist/bench-*.txt

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Every level on every platform (that the runners could run) must search exactly the same tree.
      - name: Check the bench signatures match
        run: |
          grep -H "Nodes searched" dist/bench-*.txt
          [ "$(grep -h "Nodes searched" dist/bench-*.txt | tr -d '\r' | sort -u | wc -l)" -eq 1 ]
          cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: tiki-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nodes=$(grep -h "Nodes searched" dist/bench-x86-64-bmi2.txt | tr -dc '0-9')
          cat > notes.md <<EOF
          Unpack one package and run \`tiki-$GITHUB_REF_NAME/scripts/run.sh\` on Linux or
          \`tiki-$GITHUB_REF_NAME\\scripts\\run.bat\` on Windows (or point a UCI GUI at it).
          The network is in \`models/\`; set \`TIKI_EVALFILE\` to use another.
          It's also built into \`bin/tiki\` and \`bin/tiki.exe\`, so a GUI can run them directly (\`TIKI_EVALFILE\` or the \`EvalFile\` option still override it).

          Pick the fastest package your CPU runs (Stockfish's names; all give the same moves and bench):

          | Package (\`linux-\` or \`windows-\`) | CPUs |
          |---|---|
          | \`x86-64-avx512icl\` | Intel Ice Lake, Tiger Lake, Rocket Lake, Sapphire Rapids or later; AMD Zen 4 or later |
          | \`x86-64-vnni512\` | AVX-512 VNNI (Intel Cascade Lake and the above) |
          | \`x86-64-avx512\` | AVX-512 without VNNI (Intel Skylake-X, Cannon Lake) |
          | \`x86-64-avxvnni\` | Intel Alder Lake and later desktop/laptop CPUs without AVX-512 |
          | \`x86-64-bmi2\` | Intel Haswell (2013) or later, AMD Zen 3 or later |
          | \`x86-64-avx2\` | AMD Zen 1/2 (AVX2, but PEXT is slow), and AVX2 CPUs without BMI2 |
          | \`x86-64-sse41-popcnt\` | Older x86-64 CPUs with SSE4.1 and POPCNT (Intel Nehalem, AMD Bulldozer) |
          | \`x86-64\` | Any x86-64 CPU |

          Bench signature: $nodes nodes.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "tiki $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes
